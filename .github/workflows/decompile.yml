name: Automated
on: 
  push:
    paths:
      - 'libs/**.so'
  workflow_dispatch: # Дозволяє запускати процес вручну через сайт GitHub

permissions:
  contents: write # Дає роботу дозвіл записувати згенерований код назад у репозиторій

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      # 1. Стягуємо репозиторій (з підтримкою великих файлів Git LFS)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true # Actions обов'язково має викачати сам файл, а не просто посилання

      # 2. Встановлюємо Radare2 на віртуальну машину GitHub
      - name: Install Radare2
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2

      # 3. Супер-швидка обробка великого файлу без авто-аналізу
      - name: Run Lightning Fast Decompiler
        run: |
          mkdir -p decompiled_code
          for file in libs/**/*.so; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .so)
              echo "===> Супер-швидка обробка $file без аналізу масивів..."
              
              # 1. Витягуємо весь текст (паролі, URL, токени) - ПРАЦЮЄ ЗАВЖДИ
              strings "$file" > "decompiled_code/${filename}_strings.txt"
              
              # 2. Витягуємо таблицю всіх JNI та експортованих функцій - ПРАЦЮЄ ЗАВЖДИ
              r2 -q -c "is" "$file" > "decompiled_code/${filename}_exported_symbols.txt"
              
              # 3. Роздруковуємо загальну інформацію про бінарник та перші 100 рядків коду
              # БЕЗ команд авто-аналізу (aa/aaa), щоб уникнути зависання сервера.
              r2 -q -c "i; pd 100" "$file" > "decompiled_code/${filename}_entry_code.txt" || true
            fi
          done

      # 4. Автоматично комітимо і пушимо згенерований код назад в репозиторій
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Ультимативна швидка авто-декомпіляція .so [GitHub Actions]"
          file_pattern: 'decompiled_code/*' # Записуємо тільки результати роботи

