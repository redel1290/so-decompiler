name: Automated .so Decompilation
on: 
  push:
    paths:
      - 'libs/**.so'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Radare2
        run: |
          sudo apt-get update
          sudo apt-get install -y radare2

      - name: Smart Targeted Decompilation
        run: |
          mkdir -p decompiled_code
          for file in libs/**/*.so; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" .so)
              echo "===> Розумний аналіз функцій для $file..."
              
              # 1. Текстові рядки залишаємо (це завжди корисно)
              strings "$file" > "decompiled_code/${filename}_strings.txt"
              
              # 2. Зберігаємо список експортованих функцій (символів)
              r2 -q -c "is" "$file" > "decompiled_code/${filename}_exported_symbols.txt"
              
              # 3. ХІРУРГІЧНИЙ ДЕКОМПІЛЯТОР:
              # Робимо ТІЛЬКИ аналіз символів (af), щоб знайти межі функцій.
              # Після цього перебираємо всі знайдені функції (через @@f) 
              # і роздруковуємо їхній декомпільований код (pdf) у фінальний файл.
              # Це дозволяє обійти гігантські масиви даних, які вішали сервер.
              r2 -q -c "af; pdf @@f" "$file" > "decompiled_code/${filename}_decompiled_functions.txt" || true
            fi
          done

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Розумна декомпіляція функцій .so [GitHub Actions]"
          file_pattern: 'decompiled_code/*'

